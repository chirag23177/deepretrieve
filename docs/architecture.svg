<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="470" fill="#fbfcfd"/>

  <!-- ================= OFFLINE ================= -->
  <rect x="16" y="16" width="948" height="196" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="42" font-size="14" font-weight="700" fill="#334155">OFFLINE — training &amp; index build</text>

  <!-- raw data -->
  <rect x="34" y="58" width="132" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="82" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">MovieLens-25M</text>
  <text x="100" y="100" font-size="11" text-anchor="middle" fill="#64748b">25M ratings</text>

  <!-- preprocess -->
  <rect x="196" y="58" width="150" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="271" y="78" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">preprocess</text>
  <text x="271" y="95" font-size="10.5" text-anchor="middle" fill="#64748b">rating ≥ 4 · k-core</text>
  <text x="271" y="109" font-size="10.5" text-anchor="middle" fill="#64748b">global temporal split</text>

  <!-- two-tower training -->
  <rect x="376" y="58" width="164" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="458" y="78" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">two-tower training</text>
  <text x="458" y="95" font-size="10.5" text-anchor="middle" fill="#64748b">in-batch softmax negs</text>
  <text x="458" y="109" font-size="10.5" text-anchor="middle" fill="#64748b">+ logQ correction</text>

  <!-- item vectors -->
  <rect x="570" y="58" width="140" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="640" y="82" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">item vectors</text>
  <text x="640" y="100" font-size="11" text-anchor="middle" fill="#64748b">17,421 × 64, L2-norm</text>

  <!-- faiss build -->
  <rect x="740" y="58" width="190" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="835" y="82" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">FAISS index</text>
  <text x="835" y="100" font-size="10.5" text-anchor="middle" fill="#64748b">IndexFlatIP (+ IVF benchmark)</text>

  <!-- ranker training row -->
  <rect x="376" y="140" width="164" height="54" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="458" y="160" font-size="12.5" font-weight="600" text-anchor="middle" fill="#065f46">ranker labels</text>
  <text x="458" y="177" font-size="10.5" text-anchor="middle" fill="#64748b">late-train window only</text>

  <rect x="570" y="140" width="140" height="54" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="640" y="160" font-size="12.5" font-weight="600" text-anchor="middle" fill="#065f46">LightGBM</text>
  <text x="640" y="177" font-size="10.5" text-anchor="middle" fill="#64748b">LambdaRank</text>

  <rect x="740" y="140" width="190" height="54" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="835" y="160" font-size="12.5" font-weight="600" text-anchor="middle" fill="#065f46">feature store</text>
  <text x="835" y="177" font-size="10.5" text-anchor="middle" fill="#64748b">pop · genres · user aggs</text>

  <!-- offline arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M166 88 H190"/>
    <path d="M346 88 H370"/>
    <path d="M540 88 H564"/>
    <path d="M710 88 H734"/>
    <path d="M271 118 V167 H370"/>
    <path d="M540 167 H564"/>
    <path d="M710 167 H734"/>
    <path d="M458 118 V134"/>
  </g>

  <!-- ================= ONLINE ================= -->
  <rect x="16" y="234" width="948" height="216" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="260" font-size="14" font-weight="700" fill="#3730a3">ONLINE — GET /recommend/{user_id}?k=10   (FastAPI, Docker)</text>

  <rect x="34" y="292" width="120" height="66" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="94" y="320" font-size="12.5" font-weight="600" text-anchor="middle" fill="#312e81">user_id</text>
  <text x="94" y="338" font-size="10.5" text-anchor="middle" fill="#64748b">raw → index</text>

  <rect x="186" y="292" width="130" height="66" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="251" y="315" font-size="12.5" font-weight="600" text-anchor="middle" fill="#312e81">user vector</text>
  <text x="251" y="332" font-size="10.5" text-anchor="middle" fill="#64748b">precomputed</text>
  <text x="251" y="346" font-size="10.5" text-anchor="middle" fill="#64748b">(id-only tower)</text>

  <rect x="348" y="292" width="150" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="423" y="315" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">FAISS top-200</text>
  <text x="423" y="332" font-size="10.5" text-anchor="middle" fill="#64748b">inner product = cosine</text>
  <text x="423" y="346" font-size="10.5" text-anchor="middle" fill="#64748b">seen items filtered</text>

  <rect x="530" y="292" width="160" height="66" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="610" y="315" font-size="12.5" font-weight="600" text-anchor="middle" fill="#065f46">feature builder</text>
  <text x="610" y="332" font-size="10.5" text-anchor="middle" fill="#64748b">cross features:</text>
  <text x="610" y="346" font-size="10.5" text-anchor="middle" fill="#64748b">genre affinity · recency</text>

  <rect x="722" y="292" width="120" height="66" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="782" y="320" font-size="12.5" font-weight="600" text-anchor="middle" fill="#065f46">LightGBM</text>
  <text x="782" y="338" font-size="10.5" text-anchor="middle" fill="#64748b">rerank 200</text>

  <rect x="874" y="292" width="72" height="66" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="910" y="320" font-size="12.5" font-weight="600" text-anchor="middle" fill="#312e81">top-k</text>
  <text x="910" y="338" font-size="10.5" text-anchor="middle" fill="#64748b">JSON</text>

  <g stroke="#4f46e5" stroke-width="1.6" fill="none" marker-end="url(#ar2)">
    <path d="M154 325 H180"/>
    <path d="M316 325 H342"/>
    <path d="M498 325 H524"/>
    <path d="M690 325 H716"/>
    <path d="M842 325 H868"/>
  </g>

  <!-- stage ownership annotations -->
  <text x="423" y="386" font-size="10.5" text-anchor="middle" fill="#1e3a8a" font-weight="600">retrieval owns recall</text>
  <text x="666" y="386" font-size="10.5" text-anchor="middle" fill="#065f46" font-weight="600">ranking owns precision @ top</text>
  <text x="490" y="416" font-size="10.5" text-anchor="middle" fill="#475569">Cross features cannot live in retrieval — item vectors must be user-independent to be indexed.</text>
  <text x="490" y="433" font-size="10.5" text-anchor="middle" fill="#475569">That constraint is the whole reason the system is two-stage.</text>

  <!-- artifact hand-off arrows (offline -> online) -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar3)">
    <path d="M835 118 V240 H423 V286"/>
    <path d="M640 194 V240 H782 V286"/>
    <path d="M835 194 V222 H610 V286"/>
  </g>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
